spring:
  datasource:
    url: jdbc:h2:mem:missionbriefing;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  elasticsearch:
    uris: http://localhost:9201
  # Los tests usan H2 (Hibernate genera el esquema con create-drop); Flyway solo gestiona
  # el esquema real de Postgres.
  flyway:
    enabled: false
  security:
    user:
      name: test-user
      password: test-pass
