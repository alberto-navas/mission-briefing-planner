server:
  port: 8080

spring:
  application:
    name: mission-server
  datasource:
    url: jdbc:postgresql://localhost:5432/missionbriefing
    username: missionbriefing
    password: missionbriefing
  jpa:
    hibernate:
      # El esquema lo crea Flyway (db/migration); Hibernate solo valida que las entidades
      # coincidan con las tablas reales al arrancar, en vez de generarlas el mismo.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  elasticsearch:
    uris: http://localhost:9200
  security:
    user:
      name: admin
      # Cambiar en un despliegue real; aqui solo para que la API no quede abierta por defecto.
      password: ${MISSION_API_PASSWORD:missionbriefing}
